name: Build nifiplayer APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android project files (if missing)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name nifiplayer --org com.nifi .
          fi

      - name: Add permissions to AndroidManifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "READ_MEDIA_AUDIO" "$MANIFEST"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n\n    <application#' "$MANIFEST"
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Patch on_audio_query plugin
        run: |
          PLUGIN_DIR=$(ls -d $HOME/.pub-cache/hosted/pub.dev/on_audio_query_android-*/ | head -n 1)
          GRADLE_FILE="$PLUGIN_DIR/android/build.gradle"
          echo "Patching $GRADLE_FILE"

          # نسخه‌ی Java و Kotlin را روی 17 قرار بده
          sed -i 's/VERSION_1_8/VERSION_17/g; s/VERSION_11/VERSION_17/g' "$GRADLE_FILE"
          sed -i "s/jvmTarget *= *['\"]1\.8['\"]/jvmTarget = '17'/g; s/jvmTarget *= *['\"]11['\"]/jvmTarget = '17'/g" "$GRADLE_FILE"

          # compileSdk را به 35 ببر (هر دو سینتکس قدیمی و جدید)
          sed -i -E 's/compileSdkVersion[ =]+[0-9]+/compileSdkVersion 35/; s/compileSdk[ =]+[0-9]+/compileSdk 35/' "$GRADLE_FILE"

          # اضافه کردن namespace در صورت نبود
          if ! grep -q "namespace" "$GRADLE_FILE"; then
            sed -i "s/^android {/android {\n    namespace 'com.lucasjosino.on_audio_query'/" "$GRADLE_FILE"
          fi

          echo "--- Result ---"
          grep -n "namespace\|compileSdk\|VERSION_\|jvmTarget" "$GRADLE_FILE" || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nifiplayer-apk
          path: build/app/outputs/flutter-apk/app-release.apk
