name: Build nifiplayer APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android project files (if missing)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name nifiplayer --org com.nifi .
          fi

      - name: Add permissions to AndroidManifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "READ_MEDIA_AUDIO" "$MANIFEST"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n\n    <application#' "$MANIFEST"
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Fix on_audio_query namespace
        run: |
          PLUGIN_DIR=$(ls -d $HOME/.pub-cache/hosted/pub.dev/on_audio_query_android-*/ | head -n 1)
          GRADLE_FILE="$PLUGIN_DIR/android/build.gradle"
          MANIFEST_FILE="$PLUGIN_DIR/android/src/main/AndroidManifest.xml"
          NS=$(grep -o 'package="[^"]*"' "$MANIFEST_FILE" | head -n 1 | cut -d'"' -f2)
          NS=${NS:-com.lucasjosino.on_audio_query}
          echo "Using namespace: $NS"
          if ! grep -q "namespace" "$GRADLE_FILE"; then
            sed -i "s/^android {/android {\n    namespace '$NS'/" "$GRADLE_FILE"
          fi
          grep -n "namespace" "$GRADLE_FILE" || echo "namespace not added"

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nifiplayer-apk
          path: build/app/outputs/flutter-apk/app-release.apk
